<svg xmlns="http://www.w3.org/2000/svg" width="940" height="830" viewBox="0 0 940 830" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>ESP32 D1 R32 — servo wiring</title>
<rect x="0" y="0" width="940" height="0" fill="#ffffff"/>
<text x="470" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">ESP32 D1 R32 — servo wiring</text>
