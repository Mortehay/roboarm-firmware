<text x="180" y="58" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">Bench PSU Wanptek GA305H (0–30 V / 5 A)</text>
<text x="180" y="77" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">SET: 5.5–6.0 V  ·  CURRENT LIMIT: 3 A</text>
<text x="180" y="94" text-anchor="middle" font-size="10" fill="#111">first power-up at 5.5 V; never above 6.0 V</text>
<text x="52" y="130" text-anchor="end" font-size="10" fill="#d00000" font-weight="bold">OUT +</text>
<text x="192" y="130" text-anchor="end" font-size="10" fill="#111" font-weight="bold">OUT −</text>
