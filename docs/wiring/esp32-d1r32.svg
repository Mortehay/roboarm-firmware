<text x="460" y="596" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">ESP32 &quot;D1 R32&quot; (Uno form factor, 3.3 V logic)</text>
<text x="460" y="614" text-anchor="middle" font-size="11" fill="#a00">Signal pins labelled GPIO / header label — verify on your board's silkscreen before wiring</text>
<text x="460" y="632" text-anchor="middle" font-size="11" fill="#111">Pin labels above are for J1…J5, left to right. Never use GPIO 0, 2, 12, 15, 34, 35, 36, 39.</text>
<text x="545" y="570" text-anchor="middle" font-size="12" fill="#a00" font-weight="bold">5V / VIN</text>
<text x="875" y="645" text-anchor="end" font-size="12" fill="#111" font-weight="bold">GND</text>
