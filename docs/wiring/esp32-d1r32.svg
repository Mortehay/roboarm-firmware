<text x="392" y="217" text-anchor="start" font-size="14" fill="#d00000" font-weight="bold">+</text>
<circle cx="370" cy="225" r="5" fill="#d00000"/>
<circle cx="370" cy="165" r="5" fill="#111"/>
<text x="360" y="120" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Capacitor 470–1000 µF, rated ≥ 10 V (electrolytic), across the rails (drawn between the rails)</text>
<text x="360" y="136" text-anchor="start" font-size="11" fill="#d00000">POLARITY: stripe / short leg (−) → − rail;  long leg (+) → + rail</text>
<text x="360" y="152" text-anchor="start" font-size="11" fill="#111">Wrong way round = it can pop. Mount close to the servos.</text>
