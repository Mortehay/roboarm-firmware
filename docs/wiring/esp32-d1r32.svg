<text x="312" y="719" text-anchor="start" font-size="11" fill="#111">+ servo power (PSU + → red wires)</text>
<line x1="270" y1="735" x2="304" y2="735" stroke="#5a3a1a" stroke-width="4" stroke-linecap="round"/>
<text x="312" y="739" text-anchor="start" font-size="11" fill="#111">− servo power (brown wires, PSU −)</text>
<line x1="270" y1="755" x2="304" y2="755" stroke="#f07800" stroke-width="4" stroke-linecap="round"/>
<text x="312" y="759" text-anchor="start" font-size="11" fill="#111">signal (orange wires, board pin → servo)</text>
<line x1="270" y1="775" x2="304" y2="775" stroke="#ffd400" stroke-width="10" stroke-linecap="round"/>
<line x1="270" y1="775" x2="304" y2="775" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<text x="312" y="779" text-anchor="start" font-size="11" fill="#111" font-weight="bold">COMMON GROUND (PSU − to GND)</text>
<rect x="560" y="690" width="360" height="100" rx="6" fill="#fff0f0" stroke="#d00000" stroke-width="3"/>
<text x="740" y="718" text-anchor="middle" font-size="14" fill="#d00000" font-weight="bold">✗ do NOT connect PSU + to 5V / VIN</text>
<text x="740" y="738" text-anchor="middle" font-size="12" fill="#111">PSU + goes ONLY to the servo + rail.</text>
<text x="740" y="756" text-anchor="middle" font-size="12" fill="#111">The board gets power from USB only.</text>
<text x="740" y="774" text-anchor="middle" font-size="12" fill="#111">Only PSU − is shared with the board (GND).</text>
