<text x="115" y="705" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">Laptop</text>
<text x="115" y="723" text-anchor="middle" font-size="11" fill="#111">USB port</text>
<line x1="115" y1="680" x2="115" y2="640" stroke="#555" stroke-width="4" stroke-linecap="round"/>
<text x="125" y="665" text-anchor="start" font-size="11" fill="#111">USB: powers the board + flashing</text>
<rect x="30" y="765" width="285" height="75" rx="6" fill="#fff8e1" stroke="#c80" stroke-width="3"/>
<text x="172" y="788" text-anchor="middle" font-size="12" fill="#7a4a00" font-weight="bold">⚠ Flashing: UNPLUG the HC-05 wires</text>
<text x="172" y="806" text-anchor="middle" font-size="12" fill="#7a4a00">from D0 / D1 first. Re-plug after</text>
<text x="172" y="824" text-anchor="middle" font-size="12" fill="#7a4a00">the upload has finished.</text>
<rect x="690" y="690" width="240" height="150" rx="6" fill="#fff0f0" stroke="#d00000" stroke-width="3"/>
<text x="810" y="714" text-anchor="middle" font-size="14" fill="#d00000" font-weight="bold">✗ do NOT connect</text>
<text x="810" y="732" text-anchor="middle" font-size="14" fill="#d00000" font-weight="bold">PSU + to 5V / VIN</text>
<text x="810" y="756" text-anchor="middle" font-size="11" fill="#111">PSU + goes ONLY to the</text>
<text x="810" y="772" text-anchor="middle" font-size="11" fill="#111">servo + rail. Board and HC-05</text>
<text x="810" y="788" text-anchor="middle" font-size="11" fill="#111">are powered from USB.</text>
<text x="810" y="810" text-anchor="middle" font-size="11" fill="#111">Only PSU − is shared (GND).</text>
