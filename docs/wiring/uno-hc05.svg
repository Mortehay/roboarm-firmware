<line x1="410" y1="876" x2="440" y2="876" stroke="#f07800" stroke-width="4" stroke-linecap="round"/>
<text x="446" y="880" text-anchor="start" font-size="11" fill="#111">signal</text>
<line x1="560" y1="876" x2="590" y2="876" stroke="#ffd400" stroke-width="10" stroke-linecap="round"/>
<line x1="560" y1="876" x2="590" y2="876" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<text x="596" y="880" text-anchor="start" font-size="11" fill="#111" font-weight="bold">COMMON GROUND: PSU − ↔ Uno GND (required)</text>
<text x="30" y="910" text-anchor="start" font-size="11" fill="#111">Servo signal pins: Uno 5 V logic. Servos are powered by the PSU rail only, never from the Uno's 5V pin.</text>
